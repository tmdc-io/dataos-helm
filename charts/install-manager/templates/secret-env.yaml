apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ .Values.name }}-env
  labels:
    app: {{ .Values.label }}
    app.kubernetes.io/name: '{{ .Values.label }}'
    app.kubernetes.io/component: 'secret'
    app.kubernetes.io/part-of: '{{ .Values.application }}'
type: Opaque
data:
  PRIME_APIKEY: {{ .Values.mdcApiKey | b64enc | quote }}
  PRIME_ACCOUNT_ID: {{ .Values.mdcAccountId | b64enc | quote }}
  {{- if .Values.s3AccessKey }}
  S3_ACCESSKEY: {{ .Values.s3AccessKey | b64enc | quote  }}
  {{- end }}
  {{- if .Values.s3SecretKey }}
  S3_SECRETKEY: {{ .Values.s3SecretKey | b64enc | quote  }}
  {{- end }}
  {{- if .Values.azureBlobSecretKey }}
  AZURE_BLOB_SECRETKEY: {{ .Values.azureBlobSecretKey | b64enc | quote  }}
  {{- end }}
  {{- if .Values.hephApiKey }}
  HEPH_APIKEY: {{ .Values.hephApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.ageRecipient }}
  AGE_RECIPIENT: {{ .Values.ageRecipient | b64enc | quote }}
  {{- end }}
  {{- if .Values.ageKey }}
  AGE_KEY: {{ .Values.ageKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.includeResourceFilters }}
  INCLUDE_RESOURCE_FILTERS: {{ .Values.includeResourceFilters | b64enc | quote  }}
  {{- end }}
  {{- if .Values.secretEnvironment }}
  {{- range $conf, $value := .Values.secretEnvironment }}
  {{ $conf }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
