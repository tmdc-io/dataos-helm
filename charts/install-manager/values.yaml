# The instanceName should be the fully qualified name of the Install Instance target like "demo-test-01.moderndata.cloud"
instanceName: 
# The instanceId is the short unique identifier of the Install Instance Target like "demotest01"
instanceId: 
# The envType is the short code for the Install Instance Target like "iks" | "dks"
envType: 
# The Prime APIKEY
primeApiKey: 
# The Prime Account ID
primeAccountId: 
# The modern data prime url
mdcUrl: 
# The forge url
hephUrl: 
# The forge APIKEY
hephApiKey: 
# The age materials for encryption and decryption of inputs
ageRecipient:
ageKey: 

# The mode can be api | prime
mode: prime

name: dataos-manager
namespace: dataos-manager
application: install
label: dataos-manager
serviceAccountName: dataos-manager-sa

image:
  name: docker.io/tmdcio/dataos-manager
  tag: 0.34.4

replicas: 1

priorityClassName: system-cluster-critical

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: Always
  seccompProfile:
    type: RuntimeDefault

# Include an image pull secret
# imagePullSecrets: 
#   name: dataos-manager-pull-secret

# Include the cloud kernel json
# cloudKernelJson: 

containerPorts:
  - name: http
    containerPort: 20220

services:
  - name: dataos-manager
    ports:
      - name: http
        port: 20220

resources:
  requests:
    cpu: 150m
    memory: 400Mi
rbac:
  serviceAccount: true
  clusterRoleBinding:
    roleRef:
      kind: ClusterRole
      apiGroup: rbac.authorization.k8s.io
      name: cluster-admin
rbac:
  serviceAccount: true
  clusterRoleBinding:
    roleRef:
      kind: ClusterRole
      apiGroup: rbac.authorization.k8s.io
      name: install-manager-role
  clusterRole:
    name: install-manager-role
    rules:
      - apiGroups:
        - ""
        resources:
        - configmaps
        - events
        - namespaces
        - nodes
        - resourcequotas
        - persistentvolumes
