logLevel: info
metaProductName: dataos
metaMyName: dataos-manager

httpPort: 20220
httpScheme: http
tlsCrtFile: /etc/dataos/certs/tls.crt
tlsKeyFile: /etc/dataos/certs/tls.key
baseUriPath: /manager
ginMode: release

fips: disabled
tokenHashType: md5

homeDir: /opt/dataos/home
operateSubDir: operate
helmFetchSubDir: charts
templateSubDir: deploy
renderSubDir: rendered
defaultChartRepo: dataos-base

volumeMounts:
  - name: home
    mountPath: "/opt/dataos/home"
volumes:
  - name: home
    emptyDir: {}

helmBinary: /usr/local/bin/helm
sopsBinary: /usr/local/bin/sops
dataosCtlBinary: /usr/local/bin/dataos-ctl-v3
dataosCtlScriptDir: /opt/dataos/v3
dataosCtlBaseConfigDir: /etc/dataos/v3
helmConfigHome: /opt/dataos/home/helm/.config
helmCacheHome: /opt/dataos/home/helm/.cache
helmDataHome: /opt/dataos/home/helm/.local

# Skip TLS verification for heph client (needed for cluster-local private CA certs)
hephInsecure: true
enablePrimeSyncUp: true
enablePrimeSyncExecute: true
primeSyncIntervalUp: 5m
primeSyncIntervalExecute: 30s

gitOpsProviderType: 
gitOpsRootDir: gitopsroot
gitSubDir: git
gitTMinus1Dir: git-t-1
gitSubSubDir: git
gitZipFileName: gitops.zip
gitopsInstallManifestFileName: dataos.release.yaml
gitopsTempDir: /opt/dataos/home/tmp

executeTasksProviderType: 
executeTasksRootDir: executetasksroot

# these values supply the location to store gitops outputs
# s3Endpoint: 
# s3Region: 
# s3Bucket: 
# s3AccessKey: 
# s3SecretKey: 
# s3DisableSsl: false
# s3ForcePathStyle: false
# azureBlobStorageAccount: 
# azureBlobEndpointSuffix: 
# azureBlobContainer: 
# azureBlobSecretKey: 

# Defines the resource quota for the dataos-manager namespace
resourceQuota:
  podsQuota: 5
  priorityClasses:
  - system-cluster-critical

# Use to Enable a Service Monitor
# serviceMonitor:
#   endpoints:
#   - targetPort: http
#     interval: 30s
#     scrapeTimeout: 30s
